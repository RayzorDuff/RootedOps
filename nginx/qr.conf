server {
    server_name qr.danks.store;

    # Stable public QR entry point. The n8n webhook path stays private behind
    # this hostname so printed labels do not depend on an n8n URL.
    location = /r {
        proxy_pass http://127.0.0.1:5678/webhook/mushroomprocess/qr/resolve;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
