# STAGING configuration only. Production hostnames live in nginx/production/mailflow.conf.
# Webmail only; HTTPS terminates at the existing host nginx / Certbot layer.
# If your nginx installation requires explicit TLS directives, add them with Certbot,
# following the existing RootedOps host deployment convention.
server {
    listen 80;
    server_name mail-test.danks.store;
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
