# authentik is accessible ONLY behind host nginx + HTTPS. No DNS or certs
# are created by Compose. Adapt this HTTP-only example to your existing
# Certbot-managed production vhost before accepting credentials.
server {
    listen 80;
    server_name auth.danks.store;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:9092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
