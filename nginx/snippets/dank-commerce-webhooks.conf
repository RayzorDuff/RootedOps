# Include inside BOTH shop-test and dankmushrooms.net HTTPS server blocks.
# Confirm ports against the installed receiver units BEFORE installation.
# No URI suffix on proxy_pass: signed request body/path remain unchanged.
location = /webhooks/woocommerce-customer/shop-test.danks.store {
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location = /webhooks/woocommerce/danks.store {
    proxy_pass http://127.0.0.1:8102;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
