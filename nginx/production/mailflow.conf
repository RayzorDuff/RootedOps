# Production MailFlow entrypoints: nine hostnames, one local service.
# Apply only after DNS and HTTPS certificates are configured; use Certbot
# or the existing production HTTPS Nginx pattern before accepting credentials.
server {
    listen 80;
    server_name mail.dankmushrooms.net mail.danks.farm mail.danks.net mail.danks.services mail.danks.store mail.edanks.com mail.rootedpsyche.com mail.rootedpsyche.net mail.rootedpsyche.org;
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
