# Minecraft Bedrock is not HTTP. This file belongs in the top-level nginx `stream {}` context,
# not inside sites-enabled/http server blocks. It is only needed if NGINX will own UDP/19132
# and forward it to Docker's localhost mapping. If Docker publishes 19132/udp directly, you can
# skip this NGINX stream proxy and just point DNS to the host.

upstream minecraft_bedwars_udp {
    server 127.0.0.1:19132;
}

server {
    listen 19132 udp reuseport;
    proxy_timeout 600s;
    proxy_responses 1;
    proxy_pass minecraft_bedwars_udp;
}
