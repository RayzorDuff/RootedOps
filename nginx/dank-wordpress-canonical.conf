# New hostname only. Do not replace the old host's TLS/vhost configuration.
# Install the reviewed webhook snippet, then provision net-only TLS with certbot.
server {
    listen 80;
    server_name dankmushrooms.net;
    client_max_body_size 64m;
    include /etc/nginx/snippets/dank-commerce-webhooks.conf;
    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
