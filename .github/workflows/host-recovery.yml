name: Fresh host recovery
on:
  push:
    branches: [main, 'feat/fresh-host-recovery']
  pull_request:
permissions:
  contents: read
jobs:
  prepare-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s tests -p 'test_host_recovery.py' -v
      - run: make commerce-test
      - run: bash -n linode_bootstrap.sh backup/*.sh
      - run: python -m py_compile scripts/host_recovery.py scripts/full_restore.py
      - run: python scripts/host_recovery.py prepare "$RUNNER_TEMP/rootedops-recovery"
      - run: python scripts/host_recovery.py validate "$RUNNER_TEMP/rootedops-recovery"
      - name: Native ERP MariaDB healthcheck
        run: |
          cfg="$RUNNER_TEMP/rootedops-recovery"
          docker compose --env-file "$cfg/.env" -f "$cfg/core.yml" up -d erpnext-db
          for attempt in $(seq 1 90); do
            cid=$(docker compose --env-file "$cfg/.env" -f "$cfg/core.yml" ps -q erpnext-db)
            if [ "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy ]; then exit 0; fi
            sleep 2
          done
          exit 1
