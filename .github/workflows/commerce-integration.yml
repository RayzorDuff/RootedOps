name: Commerce integration contracts
on:
  pull_request:
    paths: ['integrations/commerce/**', 'erpnext/apps/rootedops_commerce/**', 'tests/test_commerce*', '.github/workflows/commerce-integration.yml']
permissions:
  contents: read
jobs:
  inbox:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: commerce_test
          POSTGRES_USER: commerce_test
          POSTGRES_PASSWORD: synthetic-only
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U commerce_test" --health-interval=5s --health-retries=12
    env:
      PGHOST: localhost
      PGUSER: commerce_test
      PGPASSWORD: synthetic-only
      PGDATABASE: commerce_test
      COMMERCE_STAGING_ONLY: '1'
      COMMERCE_INBOX_DSN: postgresql://commerce_test:synthetic-only@localhost:5432/commerce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RayzorDuff/MushroomProcess
          ref: 53a60144e50330cd00b510689f7982e4046c5835
          path: .ci/mushroomprocess
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]==3.3.6'
      - run: |
          set -euo pipefail
          for file in .ci/mushroomprocess/schema/pgsql/0*.sql; do psql -v ON_ERROR_STOP=1 -f "$file"; done
          python integrations/commerce/test_inbox_postgres.py -v
  frappe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-ci-only
          MARIADB_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - name: Native Frappe/ERPNext v16 disposable site
        run: |
          docker run --rm --network host --entrypoint bash -e COMMERCE_NATIVE_CI=1 \
            -v "$PWD/erpnext/apps/rootedops_commerce:/opt/rootedops_commerce:ro" \
            -v "$PWD/scripts/commerce_frappe_ci.sh:/opt/commerce_frappe_ci.sh:ro" \
            frappe/erpnext:v16.13.0 /opt/commerce_frappe_ci.sh
  appsmith-harness-contracts:
    name: SignatureGate offline harness contracts (not browser E2E)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: signaturegate_e2e
          POSTGRES_USER: signaturegate_e2e
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U signaturegate_e2e" --health-interval=5s --health-retries=12
    env:
      E2E_DATABASE_URL: postgresql://signaturegate_e2e:synthetic-ci-only@127.0.0.1:5432/signaturegate_e2e
      E2E_INSTANCE_TOKEN: synthetic-ci-instance-marker-not-a-live-credential
      E2E_ALLOW_RESET: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RayzorDuff/SignatureGate
          ref: eafc0c7068e8e99ae9ec405371f9203ba68d73db
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix e2e --ignore-scripts --no-audit --no-fund
      - run: npm run --prefix e2e test:guards
      - run: node e2e/database.test.mjs
      - run: npm run --prefix e2e test:list
