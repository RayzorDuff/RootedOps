# Opt-in extension for Rooted Psyche Board meeting files.
# Use alongside docker/docker-compose.wordpress.yml only after creating the
# host folder and reviewing the board-library plugin deployment.
services:
  rootedpsyche-wordpress:
    volumes:
      - ${ROOTEDPSYCHE_BOARD_MEETINGS_HOST_PATH:?Set ROOTEDPSYCHE_BOARD_MEETINGS_HOST_PATH in .env}:/srv/rootedpsyche-board-meetings:ro
