# Opt-in; separate credentials, DB and volumes from Rooted Psyche.
name: dank-store-test
services:
  dank-wordpress-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: dank_wordpress
      MARIADB_USER: dank_wordpress
      MARIADB_PASSWORD: ${DANK_WP_DB_PASSWORD:?Set DANK_WP_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DANK_WP_DB_ROOT_PASSWORD:?Set DANK_WP_DB_ROOT_PASSWORD}
    volumes:
      - dank_wordpress_db:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'healthcheck.sh --connect --innodb_initialized']
      interval: 15s
      timeout: 5s
      retries: 12
  dank-wordpress:
    image: wordpress:7.1.4-php8.3-apache
    restart: unless-stopped
    depends_on:
      dank-wordpress-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: dank-wordpress-db:3306
      WORDPRESS_DB_NAME: dank_wordpress
      WORDPRESS_DB_USER: dank_wordpress
      WORDPRESS_DB_PASSWORD: ${DANK_WP_DB_PASSWORD:?Set DANK_WP_DB_PASSWORD}
      DANK_WP_CUSTOMER_WEBHOOK_ENABLED: ${DANK_WP_CUSTOMER_WEBHOOK_ENABLED:-0}
      DANK_MP_WOO_ENABLED: ${DANK_MP_WOO_ENABLED:-0}
      DANK_MP_CASH_ENABLED: ${DANK_MP_CASH_ENABLED:-0}
      DANK_MP_WOO_CUTOFF: ${DANK_MP_WOO_CUTOFF:-}
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        define('ROOTEDOPS_CUSTOMER_WEBHOOK_ENABLED', getenv('DANK_WP_CUSTOMER_WEBHOOK_ENABLED') === '1');
        define('ROOTEDOPS_MP_WOO_ENABLED', getenv('DANK_MP_WOO_ENABLED') === '1');
        define('ROOTEDOPS_MP_CASH_ENABLED', getenv('DANK_MP_CASH_ENABLED') === '1');
        if (ctype_digit(getenv('DANK_MP_WOO_CUTOFF') ?: '')) {
          define('ROOTEDOPS_MP_WOO_CUTOFF', (int) getenv('DANK_MP_WOO_CUTOFF'));
        }
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
    ports:
      - '127.0.0.1:${DANK_WP_TEST_PORT:-8097}:80'
    volumes:
      - dank_wordpress_html:/var/www/html
      - ../wordpress/dank-mu-plugins/rootedops-customer-webhook.php:/var/www/html/wp-content/mu-plugins/rootedops-customer-webhook.php:ro
      - ../wordpress/dank-mu-plugins/rootedops-fulfillment.php:/var/www/html/wp-content/mu-plugins/rootedops-fulfillment.php:ro
      - ../wordpress/dank-mu-plugins/rootedops-ecwid-history.php:/var/www/html/wp-content/mu-plugins/rootedops-ecwid-history.php:ro
  dank-wordpress-cli:
    image: wordpress:cli-php8.3
    profiles: [tools]
    user: '33:33'
    entrypoint: [wp]
    working_dir: /var/www/html
    environment:
      WORDPRESS_DB_HOST: dank-wordpress-db:3306
      WORDPRESS_DB_NAME: dank_wordpress
      WORDPRESS_DB_USER: dank_wordpress
      WORDPRESS_DB_PASSWORD: ${DANK_WP_DB_PASSWORD:?Set DANK_WP_DB_PASSWORD}
    volumes:
      - dank_wordpress_html:/var/www/html
volumes:
  dank_wordpress_db:
  dank_wordpress_html:
